name: GitHub Metrics with Private Repos
on:
  schedule:
    - cron: "0 */6 * * *"  # A cada 6 horas
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Clebio2030
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          config_display: large
          config_output: svg
          filename: github-metrics.svg
          config_twemoji: yes
          
          # Idioma português
          config_locale: pt-br
          
          # Incluir repositórios privados
          repositories: 300
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member
          
          # Plugin de atividade
          plugin_activity: yes
          plugin_activity_days: 30
          plugin_activity_filter: all
          plugin_activity_limit: 5
          plugin_activity_load: 300
          plugin_activity_visibility: all
          plugin_activity_timestamps: yes
          
          # Plugin de linguagens mais usadas
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage
          
          # Plugin de habits (padrões de commit)
          plugin_habits: yes
          plugin_habits_charts_type: classic
          plugin_habits_days: 30
          plugin_habits_facts: yes
          plugin_habits_from: 300
          plugin_habits_languages_limit: 8
          plugin_habits_languages_threshold: 0%
          
          # Plugin de traffic (visitantes)
          plugin_traffic: yes
          
          # Desabilitar seções que você não quer
          base_indepth: no
          plugin_lines: no
          plugin_notable: no
          plugin_achievements: no
          plugin_calendar: no
