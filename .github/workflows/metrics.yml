name: GitHub Metrics with Private Repos
on:
  schedule:
    - cron: "0 */6 * * *"  # A cada 6 horas
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Clebio2030
          template: classic
          base: header, activity, community, repositories
          config_timezone: America/Sao_Paulo
          config_display: large
          config_output: svg
          filename: stats/github-metrics.svg
          config_twemoji: yes
          config_padding: 0, 8 + 11%
          
          # Idioma português
          # config_locale: pt-br
          
          # Incluir repositórios privados
          repositories: 300
          repositories_forks: yes
          repositories_affiliations: owner, collaborator, organization_member
          
          # Plugin de linguagens mais usadas
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: github
          plugin_languages_limit: 8
          plugin_languages_recent_categories: markup, programming
          plugin_languages_recent_days: 30
          plugin_languages_recent_load: 300
          plugin_languages_sections: most-used
          plugin_languages_threshold: 0%
          plugin_languages_details: bytes-size, percentage
          
          # Plugin de isocalendar (mapa de commits)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # Desabilitar plugins com erro
          plugin_activity: no
          plugin_habits: no
          plugin_notable: no
          plugin_lines: no
          plugin_achievements: no
          plugin_calendar: no
          plugin_traffic: no
