name: Update Spotify

on:
  schedule:
    - cron: "0 */1 * * *" # A cada hora
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Update Spotify Section
        uses: novas0x2a/spotify-readme@v1
        with:
          client_id: ${{ secrets.SPOTIFY_CLIENT_ID }}
          client_secret: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          refresh_token: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          user_id: ${{ secrets.SPOTIFY_USER_ID }}
          template: "**Ouvindo agora:** <br/> <img src='{image}' width='300' /> <br/> <sub>{name} por {artist}</sub>"

